name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node tools/check.mjs
      - name: Library tests
        run: node tools/test-lib.mjs
      - name: DOM → Markdown snapshot (headless Chrome)
        run: node tools/test-dom.mjs
        env:
          CHROME: /usr/bin/google-chrome
      - name: Package
        run: python3 tools/build-zip.py
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.zip
          retention-days: 14
